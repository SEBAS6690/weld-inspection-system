<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección VT - API 1104</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Encabezado -->
        <header class="app-header">
            <h1>Sistema de inspeccion visual - API 1104</h1>
            <p>coloque el cordón de soldadura dentro de la guía</p>
        </header>

        <!-- Panel de Control -->
        <div class="controls-panel">
            <label for="pipeSelect">Diámetro Nominal de Tubería (OD):</label>
            <select id="pipeSelect">
                <option value="4">4" (OD: 114.3 mm)</option>
                <option value="6">6" (OD: 168.3 mm)</option>
                <option value="8" selected>8" (OD: 219.1 mm)</option>
                <option value="10">10" (OD: 273.1 mm)</option>
                <option value="12">12" (OD: 323.9 mm)</option>
            </select>
        </div>

        <!-- Visor de Cámara y Overlay -->
        <div class="camera-viewport">
            <video id="webcamFeed" autoplay playsinline muted></video>
            <canvas id="captureCanvas"></canvas>

            <!-- CAPA DE GUÍAS VISUALES (OVERLAY) -->
            <div class="overlay-guides">
                <div class="guide-line-top"></div>
                <div class="roi-box">
                    <span class="roi-label">Alinee el cordón de soldadura aquí</span>
                </div>
                <div class="guide-line-bottom"></div>
            </div>
        </div>

        <!-- Botón de Acción -->
        <div class="action-panel">
            <button id="captureBtn" class="btn-capture">Capturar e Inspeccionar</button>
        </div>

        <!-- Panel de Resultados -->
        <div id="resultsPanel" class="results-panel">
            <div id="resultsCard" class="results-card">
                <div class="verdict-header">
                    <span class="verdict-title">Resultado de Inspección</span>
                    <span id="verdictBadge" class="verdict-badge">---</span>
                </div>
                <ul class="details-list">
                    <li>Tubería: <span id="resPipe">---</span></li>
                    <li>Escala: <span id="resScale">---</span></li>
                    <li>Defecto Detectado: <span id="resDefect">---</span></li>
                    <li>Tamaño Defecto: <span id="resSize">---</span></li>
                    <li>Cláusula Aplicada: <span id="resClause">---</span></li>
                    <li>Observación: <span id="resObs">---</span></li>
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
