<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Inspección Visual API 1104</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos Phosphor / FontAwesome para estética industrial -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Encabezado Principal -->
        <header class="app-header">
            <div class="logo-title">
                <i class="fa-solid fa-microscope icon-glow"></i>
                <div>
                    <h1>INSPECCIÓN VT - API 1104</h1>
                    <p class="subtitle">Alinee el cordón de soldadura dentro de la guía</p>
                </div>
            </div>
        </header>

        <!-- Selector de Diámetro Nominal -->
        <section class="controls-section">
            <label for="pipeSelect">
                <i class="fa-solid fa-ruler-combined"></i> Diámetro Nominal de Tubería (OD):
            </label>
            <select id="pipeSelect" class="styled-select">
                <option value="4">4" (OD: 114.3 mm)</option>
                <option value="6">6" (OD: 168.3 mm)</option>
                <option value="8" selected>8" (OD: 219.1 mm)</option>
                <option value="10">10" (OD: 273.1 mm)</option>
                <option value="12">12" (OD: 323.9 mm)</option>
            </select>
        </section>

        <!-- Visor de Cámara y Overlay de Alineación -->
        <section class="viewport-section">
            <div class="video-wrapper">
                <video id="webcamFeed" autoplay playsinline muted></video>
                <canvas id="captureCanvas" style="display: none;"></canvas>

                <!-- Retícula de Guiado / Overlay Visual -->
                <div class="overlay-grid">
                    <div class="pipe-outer-frame">>
                         <div class="weld-roi-box"></div>
                    </div>
                </div>
            </div>

            <!-- Botón de Acción Principal -->
            <button id="captureBtn" class="primary-btn">
                <i class="fa-solid fa-camera"></i> CAPTURAR E INSPECCIONAR
            </button>
        </section>

        <!-- Panel de Resultados de Inspección -->
        <section id="resultsPanel" class="results-section" style="display: none;">
            <div id="resultsCard" class="results-card">
                
                <!-- Encabezado de Resultados -->
                <div class="card-header">
                    <h2><i class="fa-solid fa-clipboard-check"></i> RESULTADO DE EVALUACIÓN</h2>
                    <span id="verdictBadge" class="verdict-badge">APROBADO</span>
                </div>

                <!-- Imagen Analizada con Bounding Box enmarcado -->
                <!-- Imagen Analizada con Bounding Box enmarcado -->
                <div class="result-image-container" style="margin: 15px 0; text-align: center;">
                    <h3 style="font-size: 0.85rem; color: #8a99ad; margin-bottom: 8px;">
                        <i class="fa-solid fa-bullseye"></i> DEFECTO ENMARCADO (IA):
                    </h3>
                    <img id="resAnnotatedImg" src="" alt="Detección de Defectos" 
                        style="width: 100%; max-width: 100%; border-radius: 8px; border: 2px solid #00ff88; display: none; background: #000;">
                </div>

                <!-- Ficha Técnica de Resultados -->
                <div class="details-grid">
                    <div class="detail-item">
                        <span class="label">Tubería Nominal:</span>
                        <span id="resPipe" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Escala Calculada:</span>
                        <span id="resScale" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Discontinuidad:</span>
                        <span id="resDefect" class="value highlight">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Tamaño Estimado:</span>
                        <span id="resSize" class="value highlight">--</span>
                    </div>
                    <div class="detail-item full-width">
                        <span class="label">Cláusula de Norma Aplicada:</span>
                        <span id="resClause" class="value code-text">--</span>
                    </div>
                    <div class="detail-item full-width">
                        <span class="label">Observación TÉCNICA:</span>
                        <span id="resObs" class="value text-obs">--</span>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
