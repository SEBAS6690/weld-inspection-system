<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inspección VT API 1104</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-title">
                <div class="icon-glow">🔬</div>
                <h1>INSPECCIÓN VISUAL VT</h1>
            </div>
            <p class="subtitle">Evaluación Automática API 1104 - Sec. 9.3</p>
        </header>

        <section class="controls-section">
            <label for="pipeOd">Diámetro Exterior de Tubería (OD):</label>
            <select id="pipeOd" class="styled-select">
                <option value="60.3">2" (60.3 mm)</option>
                <option value="88.9">3" (88.9 mm)</option>
                <option value="114.3" selected>4" (114.3 mm)</option>
                <option value="168.3">6" (168.3 mm)</option>
                <option value="219.1">8" (219.1 mm)</option>
            </select>
        </section>

        <section class="viewport-section">
            <div class="video-wrapper">
                <video id="webcamFeed" autoplay playsinline muted></video>
                <div class="overlay-grid">
                    <div class="pipe-outer-frame">
                        <div class="weld-roi-box"></div>
                    </div>
                </div>
            </div>
            <button id="btnCapture" class="primary-btn" onclick="takeInspectionPhoto()">📸 ANALIZAR JUNTA</button>
        </section>

        <section id="resultsSection" class="results-section" style="display: none;">
            <div id="resultsCard" class="results-card">
                <div class="card-header">
                    <h2>RESULTADO DE LA EVALUACIÓN</h2>
                    <span id="verdictBadge" class="verdict-badge">---</span>
                </div>

                <div class="result-image-container">
                    <h3>CAPTURA CON DETECCIÓN</h3>
                    <img id="annotatedImage" class="annotated-image" src="" alt="Resultado de Inferencia">
                </div>

                <div class="details-grid">
                    <div class="detail-item">
                        <span class="label">Discontinuidad:</span>
                        <span id="defectType" class="value highlight">---</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Tamaño Calculado:</span>
                        <span id="defectSize" class="value">---</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Tolerancia Máxima:</span>
                        <span id="maxAllowed" class="value code-text">---</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Norma Aplicada:</span>
                        <span id="normClause" class="value">API 1104 Sec. 9.3</span>
                    </div>
                    <div class="detail-item full-width">
                        <span class="label">Observaciones:</span>
                        <span id="observations" class="value text-obs">---</span>
                    </div>
                </div>

                <button id="btnOpenPdf" onclick="openPdfModal()" class="primary-btn" style="margin-top: 15px; background: #ffcc00; color: #000;">
                    📄 GENERAR REPORTE PDF
                </button>
            </div>
        </section>
    </div>

    <!-- Modal Formulario PDF -->
    <div id="pdfModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: #151c2e; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #232d42;">
            <h3 style="color: #00ff88; margin-bottom: 12px; font-size: 1.1rem;">📄 Generar Reporte PDF API 1104</h3>
            
            <label style="font-size: 0.8rem; color: #8a99ad; display: block; margin-top: 8px;">Nombre del Inspector:</label>
            <input type="text" id="inspectorName" placeholder="Ej: Ing. Víctor Yánez" class="styled-select" style="margin-top: 4px;">
            
            <label style="font-size: 0.8rem; color: #8a99ad; display: block; margin-top: 8px;">Tag / Identificador Tubería:</label>
            <input type="text" id="pipeTag" placeholder="Ej: TUB-LINE-01-A" class="styled-select" style="margin-top: 4px; margin-bottom: 15px;">

            <div style="display: flex; gap: 10px;">
                <button onclick="downloadPDF()" class="primary-btn" style="margin: 0;">📥 Descargar</button>
                <button onclick="closePdfModal()" class="primary-btn" style="margin: 0; background: #232d42; color: #fff;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
