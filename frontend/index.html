<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inspección VT - API 1104</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--accent-green);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin: 4px 0 0 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        label {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
            display: block;
        }

        .styled-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            aspect-ratio: 4/3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-capture {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }

        .btn-capture:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Sección de Resultados */
        #resultsSection {
            display: none; /* Oculto hasta recibir la respuesta */
        }

        .results-card {
            border-left: 6px solid var(--accent-green);
        }

        .results-card.rejected {
            border-left-color: var(--accent-red);
        }

        .verdict-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .verdict-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }

        .verdict-badge.rejected {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            color: var(--text-sub);
        }

        .data-value {
            font-weight: 600;
        }

        .obs-box {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <div class="header">
            <h1>🔬 INSPECCIÓN VT - API 1104</h1>
            <p>Alinee el cordón de soldadura dentro de la guía</p>
        </div>

        <!-- Panel de Cámara y Parámetros -->
        <div class="card">
            <label for="pipeDiameter">📏 Diámetro Nominal de Tubería (OD):</label>
            <select id="pipeDiameter" class="styled-select">
                <option value="114.3">4" (OD: 114.3 mm)</option>
                <option value="168.3">6" (OD: 168.3 mm)</option>
                <option value="219.1">8" (OD: 219.1 mm)</option>
                <option value="273.0">10" (OD: 273.0 mm)</option>
                <option value="323.8">12" (OD: 323.8 mm)</option>
            </select>

            <div class="video-container">
                <video id="webcamFeed" autoplay playsinline muted></video>
            </div>

            <button id="captureBtn" class="btn-capture">📸 CAPTURAR E INSPECCIONAR</button>
        </div>

        <!-- Tarjeta de Resultados (Se activa tras el análisis) -->
        <div id="resultsSection">
            <div id="resultsCard" class="card results-card">
                <div class="verdict-header">
                    <h3 style="margin:0; font-size:1.1rem;">INFORME DE EVALUACIÓN</h3>
                    <span id="verdictBadge" class="verdict-badge">APROBADO</span>
                </div>

                <div class="data-row">
                    <span class="data-label">Tipo de Discontinuidad:</span>
                    <span id="resDefectType" class="data-value">-</span>
                </div>

                <div class="data-row">
                    <span class="data-label">Dimensión Medida:</span>
                    <span id="resDefectSize" class="data-value">-</span>
                </div>

                <div class="data-row">
                    <span class="data-label">Tolerancia Máxima Admisible:</span>
                    <span id="resMaxAllowed" class="data-value">-</span>
                </div>

                <div class="data-row">
                    <span class="data-label">Cláusula de Norma:</span>
                    <span id="resNormClause" class="data-value">API 1104 Sec. 9.3</span>
                </div>

                <div class="obs-box">
                    <strong>Observaciones:</strong>
                    <p id="resObservations" style="margin:4px 0 0 0;">-</p>
                </div>

                <!-- Imagen anotada devuelta por OpenCV -->
                <div id="resultImageContainer"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
